name: Build documentation

on:
  pull_request:
  push:
    branches:
      - master
      - release/*
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.101.0'
          extended: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build and check all documentation versions
        run: make check
      - run: cp CNAME public/CNAME
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: documentation-site
          path: public

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'kubeclipper/kubeclipper.github.io' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: documentation-site
          path: public
      - uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
